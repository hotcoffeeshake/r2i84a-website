<!DOCTYPE html>
<html lang="zh-CN">

    <meta charset="UTF-8" />

      name="description"
      content="情商练习有事问AI个人中心，提供手机号登录入口，后续将支持微信扫码登录。"
    />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://r2i84a.chat/account" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="个人中心 | 情商练习有事问AI" />
    <meta
      property="og:description"
      content="手机号登录入口，后续支持微信扫码登录。"
    />
    <meta property="og:url" content="https://r2i84a.chat/account" />
    <meta property="og:image" content="https://r2i84a.chat/assets/relationship-ai-workbench.png" />
    <link rel="stylesheet" href="./styles.css?v=202607060530" />
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="/" aria-label="情商练习有事问AI 首页">
        <span>情商练习有事问AI</span>
        <small>聊天复盘 · 关系判断</small>
      </a>
      <nav class="site-nav" aria-label="主导航">
        <a href="/account">个人中心</a>
        <a href="/experience" target="_blank" rel="noopener">体验AI恋爱导师</a>
        <a href="/learn">学习提升</a>
      </nav>
    </header>

    <main>
      <section class="hero hero-page account-hero">
        <div class="hero-content account-layout">
          <div>
            <h1>个人中心</h1>
            <p class="hero-statement">先用手机号登录。</p>
            <p class="hero-copy">
              登录后可继续查看练习记录、收藏问题和学习内容。微信扫码登录会在后续版本加入。
            </p>
          </div>
          <form class="login-panel" aria-label="手机号登录">
            <label>
              <span>手机号</span>
              <input type="tel" name="phone" inputmode="tel" autocomplete="tel" placeholder="请输入手机号" />
            </label>
            <label>
              <span>验证码</span>
              <div class="code-row">
                <input type="text" name="code" inputmode="numeric" autocomplete="one-time-code" placeholder="6 位验证码" />
                <button type="button">获取验证码</button>
              </div>
            </label>
            <button class="button button-primary" type="button">手机号登录</button>
            <p class="fine-print">微信扫码登录即将开放。</p>
          </form>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <p>© 2026 鹿子野 AI Studio. 情商练习有事问AI是聊天复盘与 AI 恋爱导师项目。</p>
      <div>
