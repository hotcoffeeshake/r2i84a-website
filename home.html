<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>鹿子野的项目后室｜AI 项目与实践记录</title>
  <meta name="description" content="进入鹿子野的后室泳池，探索童锦程 Skill、信息监控、AI 图像后期、交易套利研究，以及从 0 入门 AI 和项目实战记录。" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="temple.css?v=jul27-v16" />
</head>
<body>
  <!-- 固定全屏画布 — 无遮罩 -->
  <div class="stage">
    <canvas id="video-canvas"></canvas>
  </div>

  <!-- 滚动轨道 -->
  <main class="scroll-track">

    <!-- Page 1: Hero — 居中 -->
    <section class="page page-hero" id="page1">
      <div class="hero-center">
        <p class="hero-kicker">POOLROOMS / PERSONAL ARCHIVE</p>
        <h1 class="hero-title">欢迎进入我的后室</h1>
        <button class="lg lg-btn" id="enter-btn">
          <span>入口</span>
          <span class="lg-btn-arrow">→</span>
        </button>
      </div>
    </section>

    <!-- Page 2: 导航 — 游戏加载画面 -->
    <section class="page page-nav" id="page2">

      <!-- 顶部 zone 条 — 液态玻璃容器 -->
      <div class="zone-strip lg">
        <a href="https://r2i84a.chat/" class="zone-strip-item zone-link"><i>01</i>回声长廊</a>
        <span class="zone-strip-sep">/</span>
        <span class="zone-strip-item"><i>02</i>监听井</span>
        <span class="zone-strip-sep">/</span>
        <span class="zone-strip-item"><i>03</i>显影室</span>
        <span class="zone-strip-sep">/</span>
        <span class="zone-strip-item"><i>04</i>深水层</span>
      </div>

      <!-- 左侧导航面板 — 游戏加载页风格，无玻璃 -->
      <div class="nav-panel">
        <div class="nav-brand">后室</div>
        <div class="nav-entries">
          <a class="nav-entry" href="#">
            <span class="nav-entry-id">A</span>
            <span class="nav-entry-name">项目区</span>
            <span class="nav-entry-arrow">→</span>
          </a>
          <a class="nav-entry" href="#">
            <span class="nav-entry-id">B</span>
            <span class="nav-entry-name">记录区</span>
            <span class="nav-entry-arrow">→</span>
          </a>
          <a class="nav-entry" href="#contact" id="contact-entry">
            <span class="nav-entry-id">C</span>
            <span class="nav-entry-name">联络口</span>
            <span class="nav-entry-arrow">→</span>
          </a>
        </div>
        <p class="nav-status">SYSTEM ONLINE</p>
      </div>

    </section>

  </main>

  <!-- 后台加载进度 -->
  <div class="load-chip" id="load-chip">
    <span class="load-chip-dot"></span>
    <span class="load-chip-text" id="load-chip-text">0/300</span>
  </div>

  <!-- 背景音乐 -->
  <audio id="bgm" src="audio/poolrooms.mp3" loop preload="auto"></audio>
  <button class="lg audio-toggle" id="audio-toggle" title="背景音乐开关">
    <span id="audio-icon">♪</span>
  </button>

  <!-- 加载层 -->
  <div class="loader" id="loader">
    <div class="loader-inner">
      <p class="loader-stage" id="loader-stage">INITIALIZING</p>
      <div class="loader-bar"><div class="loader-progress" id="loader-progress"></div></div>
      <p class="loader-text" id="loader-text">0 / 300</p>
      <p class="loader-hint" id="loader-hint"></p>
    </div>
  </div>

  <!-- 联络口 留言板 -->
  <div class="contact-modal" id="contact-modal">
    <div class="contact-modal-backdrop" id="contact-modal-backdrop"></div>
    <div class="lg contact-modal-panel">
      <button class="contact-modal-close" id="contact-modal-close" aria-label="关闭">×</button>
      <h2 class="contact-modal-title">留言板</h2>
      <p class="contact-modal-sub">留下你想说的，我会看到</p>
      <textarea class="contact-modal-input" id="contact-input" placeholder="写点什么…" rows="4"></textarea>
      <button class="lg-btn contact-modal-submit" id="contact-submit">
        <span>提交</span>
        <span class="lg-btn-arrow">→</span>
      </button>
      <div class="contact-modal-socials">
        <a href="https://github.com/hotcoffeeshake" target="_blank" rel="noopener noreferrer" class="social-link" aria-label="GitHub" title="GitHub">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.3 3.438 9.8 8.205 11.385.6.113.82-.26.82-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.085 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.605-2.665-.305-5.466-1.332-5.466-5.93 0-1.31.467-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.96-.267 1.98-.399 3-.405 1.02.006 2.04.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.925.42.36.81 1.096.81 2.22v3.293c0 .322.21.694.825.577C20.565 21.795 24 17.298 24 12c0-6.627-5.373-12-12-12z"/></svg>
        </a>
        <a href="https://x.com/JoshXie1" target="_blank" rel="noopener noreferrer" class="social-link" aria-label="X" title="X">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
        </a>
        <div class="social-qr-trigger" data-qr-trigger>
          <button type="button" class="social-link" aria-label="查看小红书二维码" title="小红书" aria-expanded="false" aria-controls="xiaohongshu-code">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="2" width="20" height="20" rx="5" fill="none" stroke="currentColor" stroke-width="1.8"/><text x="12" y="16" text-anchor="middle" font-size="11" font-weight="700" fill="currentColor" font-family="sans-serif">红</text></svg>
          </button>
          <div class="social-qr-popover" id="xiaohongshu-code" aria-hidden="true">
            <span>小红书</span>
            <img src="assets/social/xiaohongshu-code-bw.png" alt="小红书个人二维码" width="850" height="850" />
          </div>
        </div>
        <div class="social-qr-trigger" data-qr-trigger>
          <button type="button" class="social-link" aria-label="查看抖音二维码" title="抖音" aria-expanded="false" aria-controls="douyin-code">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19.59 6.69a4.83 4.83 0 0 1-3.77-4.25V2h-3.45v13.67a2.89 2.89 0 0 1-5.2 1.74 2.89 2.89 0 0 1 2.31-4.64 2.93 2.93 0 0 1 .88.13V9.4a6.84 6.84 0 0 0-1-.05A6.33 6.33 0 0 0 5 20.1a6.34 6.34 0 0 0 10.86-4.43v-7a8.16 8.16 0 0 0 4.77 1.52v-3.4a4.85 4.85 0 0 1-1.04-.1z"/></svg>
          </button>
          <div class="social-qr-popover" id="douyin-code" aria-hidden="true">
            <span>抖音</span>
            <img src="assets/social/douyin-code-bw.png" alt="抖音个人二维码" width="720" height="720" />
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="temple-scroll.js?v=jul27-v16"></script>
<script src="/assets/chat-quiz.js?v=20261021b" data-mode="popup" defer></script>
</body>
</html>
