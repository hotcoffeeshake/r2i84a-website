<!-- 首页右下角的小程序码浮窗（从旧首页原样搬来，build-home-page.mjs 插到 </body> 前） -->
<style id="mp-float-style">
#mpFloat{position:fixed;right:22px;bottom:22px;z-index:9999;width:246px;padding:14px;border-radius:16px;background:#141414;border:1px solid rgba(245,245,245,.14);box-shadow:0 18px 48px rgba(0,0,0,.55);opacity:0;transform:translateY(16px);transition:opacity .34s ease,transform .34s cubic-bezier(.2,.8,.2,1),width .26s ease;font-family:Inter,'PingFang SC','Microsoft YaHei',sans-serif;color:#f5f5f5;box-sizing:border-box}
#mpFloat.is-in{opacity:1;transform:none}
#mpFloat.is-collapsed{display:none}
#mpFloat.is-zoom{width:320px}
#mpFloat.is-pulse{animation:mpPulse .55s ease}
@keyframes mpPulse{0%{box-shadow:0 18px 48px rgba(0,0,0,.55)}45%{box-shadow:0 0 0 4px rgba(245,179,71,.5),0 18px 48px rgba(0,0,0,.55)}100%{box-shadow:0 18px 48px rgba(0,0,0,.55)}}
#mpFloatX{position:absolute;top:5px;right:7px;width:26px;height:26px;border:0;background:transparent;color:rgba(245,245,245,.5);font-size:18px;line-height:1;cursor:pointer;font-family:inherit}
#mpFloatX:hover{color:#f5f5f5}
.mp-tag{display:inline-block;margin:0 0 10px;padding:1px 7px;border:1px solid rgba(245,179,71,.55);border-radius:6px;color:#f5b347;font-size:11px;font-weight:600;letter-spacing:.02em}
.mp-qr{display:block;width:100%;padding:8px;border:0;border-radius:10px;background:#fff;cursor:zoom-in;box-sizing:border-box}
#mpFloat.is-zoom .mp-qr{padding:14px;cursor:zoom-out}
.mp-qr img{display:block;width:100%;height:auto;aspect-ratio:1/1;object-fit:contain;border-radius:4px}
.mp-copy{margin-top:12px}
.mp-copy strong{display:block;font-size:15px;font-weight:600;color:#f5f5f5}
.mp-hint{margin:5px 0 0;font-size:12.5px;line-height:1.5;color:rgba(245,245,245,.62)}
.mp-only-mobile{display:none}
.mp-more{margin-top:8px;padding:0;border:0;background:transparent;color:#f5b347;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit}
.mp-steps{margin:8px 0 0;padding:0;list-style:none;border-top:1px solid rgba(245,245,245,.12)}
.mp-steps li{display:grid;grid-template-columns:26px 1fr;gap:8px;padding:6px 0;font-size:12px;line-height:1.5;color:rgba(245,245,245,.72)}
.mp-steps span{color:#f5b347;font-weight:600}
#mpBubble{position:fixed;right:22px;bottom:22px;z-index:9998;display:inline-flex;align-items:center;gap:8px;padding:.75rem 1.4rem;border:0;border-radius:9999px;background:#f5b347;color:#0a0a0a;font-family:Inter,'PingFang SC',sans-serif;font-size:.95rem;font-weight:600;cursor:pointer;box-shadow:0 8px 32px rgba(245,179,71,.3);transition:transform .2s,box-shadow .2s}
#mpBubble:hover{transform:translateY(-2px);box-shadow:0 12px 40px rgba(245,179,71,.45)}
.mp-plan{display:inline-block;margin-top:8px;color:#f5b347;font-size:12px;font-weight:600;text-decoration:none}
.mp-plan:hover{text-decoration:underline}
@media (prefers-reduced-motion:reduce){#mpFloat{transition:none;opacity:1;transform:none}#mpFloat.is-pulse{animation:none}}
@media (max-width:760px){
.mp-only-desktop{display:none}
.mp-only-mobile{display:block}
#mpFloat{right:12px;left:12px;bottom:12px;width:auto;display:grid;grid-template-columns:84px minmax(0,1fr);gap:12px;align-items:center;padding:12px}
#mpFloat.is-zoom{grid-template-columns:1fr;justify-items:center}
#mpFloat.is-zoom .mp-qr{width:min(80vw,320px)}
#mpFloat.is-zoom .mp-copy{text-align:center}
.mp-tag{grid-column:1/-1;margin:0}
#mpFloatX{top:1px;right:4px}
.mp-copy{margin-top:0}
.mp-copy strong{font-size:14px}
.mp-hint{font-size:12px}
.mp-steps{width:100%}
#mpBubble{right:12px;bottom:12px}
}
</style>
<aside id="mpFloat" aria-label="微信小程序码">
  <button id="mpFloatX" type="button" aria-label="收起二维码">&#215;</button>
  <span class="mp-tag">#miniprogram</span>
  <button id="mpQrBtn" class="mp-qr" type="button" aria-label="放大小程序码">
    <img id="mpQr" src="assets/mp-qrcode.jpg" width="300" height="300" decoding="async" alt="微信小程序码：AI 恋爱导师" />
  </button>
  <div class="mp-copy">
    <strong>AI 恋爱导师</strong><a class="mp-plan" href="#pricing">开通会员 &#183; 查看套餐 &#8595;</a>
    <p class="mp-hint">微信扫一扫 &#8594; 直接进小程序提问</p>
    <p class="mp-hint">或微信搜索「练爱导师」</p>
    <p class="mp-hint mp-only-mobile">手机上：截图保存这张码 &#8594; 微信扫一扫 &#8594; 相册</p>
    <button id="mpMore" class="mp-more" type="button" aria-expanded="false">怎么用 &#9662;</button>
    <ol id="mpSteps" class="mp-steps" hidden>
      <li><span>01</span>打开微信，右上角「＋」&#8594; 扫一扫</li>
      <li><span>02</span>对准这张小程序码</li>
      <li><span>03</span>进小程序直接提问，30 秒出回答</li>
    </ol>
  </div>
</aside>
<button id="mpBubble" type="button" hidden>扫码体验</button>
<script id="mp-float-js">
(function () {
  var F = document.getElementById('mpFloat');
  if (!F) return;
  var X = document.getElementById('mpFloatX');
  var B = document.getElementById('mpBubble');
  var Q = document.getElementById('mpQrBtn');
  var M = document.getElementById('mpMore');
  var S = document.getElementById('mpSteps');
  var IMG = document.getElementById('mpQr');

  var PH = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(
    '<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300" viewBox="0 0 300 300">' +
    '<rect width="300" height="300" fill="#ebe7dd"/>' +
    '<rect x="8" y="8" width="284" height="284" fill="none" stroke="#1a1a1a" stroke-width="2" stroke-dasharray="8 6"/>' +
    '<text x="150" y="146" text-anchor="middle" font-family="monospace" font-size="16" fill="rgba(26,26,26,0.72)">小程序码待放入</text>' +
    '<text x="150" y="172" text-anchor="middle" font-family="monospace" font-size="12" fill="rgba(26,26,26,0.45)">assets/mp-qrcode.jpg</text>' +
    '</svg>');

  if (IMG) {
    var fb = function () { if (IMG.getAttribute('src') !== PH) IMG.setAttribute('src', PH); };
    IMG.addEventListener('error', fb);
    if (IMG.complete && IMG.naturalWidth === 0) fb();
  }

  setTimeout(function () { F.classList.add('is-in'); }, 900);

  function open() {
    F.classList.remove('is-collapsed');
    F.classList.add('is-in');
    F.classList.add('is-pulse');
    setTimeout(function () { F.classList.remove('is-pulse'); }, 560);
    B.hidden = true;
  }
  function close() {
    F.classList.add('is-collapsed');
    F.classList.remove('is-zoom');
    B.hidden = false;
  }

  X.addEventListener('click', close);
  B.addEventListener('click', open);
  Q.addEventListener('click', function () { F.classList.toggle('is-zoom'); });
  M.addEventListener('click', function () {
    var open2 = S.hidden;
    S.hidden = !open2;
    M.setAttribute('aria-expanded', String(open2));
    M.innerHTML = open2 ? '收起 &#9650;' : '怎么用 &#9662;';
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && !F.classList.contains('is-collapsed')) close();
  });

  document.addEventListener('click', function (e) {
    var el = e.target;
    while (el && el !== document) {
      if (el.tagName === 'A' && el.getAttribute('href')) {
        var h = el.getAttribute('href');
        if (h === '/experience' || h.indexOf('/experience') === 0 ||
            h === 'https://r2i84a.chat/experience' || h === 'http://r2i84a.chat/experience') {
          e.preventDefault();
          e.stopPropagation();
          open();
        }
        return;
      }
      el = el.parentNode;
    }
  }, true);
})();
</script>
